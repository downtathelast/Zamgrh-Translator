<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Zamgrh Translator</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="crt">

    <h1>🧟 ZAMGRH TERMINAL</h1>

    <div class="subline">
      NECRO-LINGUISTIC SIGNAL INTERFACE
    </div>

    <select id="mode">
      <option value="zombie">
        Zombie Mode
      </option>

      <option value="survivor">
        Survivor Mode
      </option>
    </select>

    <textarea
      id="input"
      placeholder="Enter signal..."
    ></textarea>

    <div class="buttons">

      <button onclick="runTranslate()">
        TRANSLATE
      </button>

      <button onclick="playGroan()">
        ☠ GROAN
      </button>

    </div>

    <div id="output">
      ...
    </div>

    <div class="status">
      █ SIGNAL ACTIVE
    </div>

  </div>

  <!-- translator -->
  <script src="translator.js"></script>

  <!-- meSpeak engine -->
  <script src="src/mespeak.js"></script>

  <script>
    meSpeak.loadConfig(
      "src/mespeak__standard_config.json"
    );

    meSpeak.loadVoice(
      "src/en-rp.json"
    );
  </script>

  <!-- zombie audio -->
  <script src="src/zombieAudio.js"></script>

  <!-- app logic -->
  <script src="script.js"></script>

</body>
</html>
